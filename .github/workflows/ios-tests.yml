name: ios-tests

on:
  push:
    branches:
      - main
      - "reconcile/**"
  pull_request:
  # Full regression on demand, for a release candidate or a suspicious change.
  workflow_dispatch:
  # Nightly, so the suite still runs against trunk every day even when no PR
  # touched a surface it covers.
  schedule:
    - cron: "0 8 * * *"

# A superseded run is wasted runner time; only the newest commit needs testing.
concurrency:
  group: ios-tests-${{ github.head_ref || github.run_number }}
  cancel-in-progress: true

jobs:
  # Decides whether this change can affect anything the Detox suite asserts on.
  # The suite is three logged-out specs; every assertion resolves to
  # js/product/ProductScreens.js or
  # js/screens/HomeScreenComponents/NavigationBar.js, plus the authentication
  # start they trigger. Nothing behind sign-in is reachable from it.
  surface:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.decide.outputs.full }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/ci-detox-surface.sh >> "$GITHUB_OUTPUT"

      - name: Report decision
        run: |
          echo "full detox: ${{ steps.decide.outputs.full }}" >> "$GITHUB_STEP_SUMMARY"
          echo "reason: ${{ steps.decide.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

  ios-iphone-tests:
    needs: surface
    if: needs.surface.outputs.full == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: yarn

      - name: Install Yarn dependencies
        run: yarn

      - name: Install macOS dependencies
        run: |
          brew tap wix/brew
          brew trust wix/brew
          brew install applesimutils
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install CocoaPods
        run: cd ios ; pod install ; cd -

      - name: Detox build
        run: |
          xcodebuild -workspace ios/Discourse.xcworkspace \
            -scheme Discourse \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            -quiet \
            build

      # --retries matches the iPad job. It covers macOS runner flake - cold
      # simulator boots have repeatedly exceeded the launch budget - not
      # product assertions. A test that fails every attempt still fails the
      # job; retries never convert a real regression into a pass.
      - name: Detox iPhone tests
        run: yarn detox test --configuration ios.sim.release --cleanup --record-logs all --retries 2

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-artifacts-iphone
          path: artifacts

  ios-ipad-tests:
    needs: surface
    if: needs.surface.outputs.full == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: yarn

      - name: Install Yarn dependencies
        run: yarn

      - name: Install macOS dependencies
        run: |
          brew tap wix/brew
          brew trust wix/brew
          brew install applesimutils
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install CocoaPods
        run: cd ios ; pod install ; cd -

      - name: Detox build
        run: |
          xcodebuild -workspace ios/Discourse.xcworkspace \
            -scheme Discourse \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            -quiet \
            build

      - name: Boot iPad simulator
        run: |
          xcrun simctl boot 'iPad (10th generation)' || true
          xcrun simctl bootstatus 'iPad (10th generation)' -b

      - name: Detox iPad tests
        run: yarn detox test --configuration ios.sim.release --cleanup --record-logs all -n 'iPad (10th generation)' --retries 2

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-artifacts-ipad
          path: artifacts
